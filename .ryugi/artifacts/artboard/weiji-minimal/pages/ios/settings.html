<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../minimal-ios.css" />
  <style>
    .toggle-track {
      width: 44px;
      height: 26px;
      border-radius: 13px;
      background: var(--color-inverse-bg);
      padding: 3px;
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }
    .toggle-knob {
      width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--color-inverse-text);
    }
  </style>
</head>
<body>
  <ryugi-ios-shell time="09:41" appearance="light">
    <div class="screen" id="root"></div>
  </ryugi-ios-shell>
  <script>
    const view = (window.ryugiProps || {}).view || "root";
    const root = document.getElementById("root");

    if (view === "profile") {
      root.innerHTML = `
        <header class="min-nav bordered">
          <span class="nav-text-btn">
            <ryugi-icon symbol="chevron.left" name="chevron-left" size="16"></ryugi-icon>
            <span>AI</span>
          </span>
          <span style="font:600 16px/22px var(--font-body);">个人画像</span>
          <span class="nav-text-btn muted">重新生成</span>
        </header>
        <div style="padding:14px 24px;border-bottom:1px solid var(--color-separator);display:flex;align-items:center;justify-content:space-between;min-height:54px;">
          <span style="font:400 15px/20px var(--font-body);">对话时结合个人画像</span>
          <span class="toggle-track" aria-label="已开启"><span class="toggle-knob"></span></span>
        </div>
        <main class="reader-body-area" style="padding-top:20px;">
          <p class="note-text" style="line-height:28px;">长期关注软件架构、极简界面设计与个人知识流。偏好第一性原理分析，厌恶冗长模板和多余装饰，记录习惯以短随记与设计/工程类书摘为主。</p>
          <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--color-separator);display:flex;justify-content:space-between;align-items:center;min-height:44px;">
            <span style="font:var(--type-meta);color:var(--color-text-secondary);">点正文可直接修改</span>
            <span style="font:400 14px/20px var(--font-body);color:var(--color-danger);">清空画像</span>
          </div>
        </main>
      `;
    } else {
      root.innerHTML = `
        <header class="min-nav bordered">
          <span class="nav-icon-btn" aria-label="关闭设置">
            <ryugi-icon symbol="xmark" name="x" size="18"></ryugi-icon>
          </span>
          <span style="font:600 16px/22px var(--font-body);">设置</span>
          <span style="width:44px;"></span>
        </header>
        <main class="settings-list">
          <div class="settings-row">
            <div>
              <div class="settings-title">账号</div>
              <div class="settings-sub">GitHub · weiji.18818888.xyz</div>
            </div>
            <ryugi-icon symbol="chevron.right" name="chevron-right" size="15" style="color:var(--color-text-secondary)"></ryugi-icon>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-title">AI</div>
              <div class="settings-sub">默认模型 GPT-4.1 mini · 画像已开启</div>
            </div>
            <ryugi-icon symbol="chevron.right" name="chevron-right" size="15" style="color:var(--color-text-secondary)"></ryugi-icon>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-title">数据</div>
              <div class="settings-sub">导入笔记 · Obsidian 同步 · 语义索引</div>
            </div>
            <ryugi-icon symbol="chevron.right" name="chevron-right" size="15" style="color:var(--color-text-secondary)"></ryugi-icon>
          </div>
        </main>
      `;
    }
  </script>
</body>
</html>
