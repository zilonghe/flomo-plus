<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../minimal-ios.css" />
  <style>
    .stats-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 4px 4px;
      gap: 8px;
      font: var(--type-meta);
      color: var(--color-text-secondary);
      font-variant-numeric: tabular-nums;
      border-bottom: 1px solid var(--color-separator);
    }
    .stats-toggle.expanded {
      border-bottom: none;
    }
    .stats-summary {
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .stats-summary strong {
      font-weight: 500;
      color: var(--color-text);
    }
    .stats-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .mini-pulse {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
    }
    .mini-pulse i {
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 1.5px;
      background: var(--heat-0);
    }
    .mini-pulse i.l1 { background: var(--heat-1); }
    .mini-pulse i.l2 { background: var(--heat-2); }
    .mini-pulse i.l3 { background: var(--heat-3); }
    .mini-pulse i.l4 { background: var(--heat-4); }

    .heat-drawer {
      padding: 6px 4px 16px;
      border-bottom: 1px solid var(--color-separator);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .heat-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 4px;
    }
    .heat-grid span {
      aspect-ratio: 1;
      border-radius: 2.5px;
      background: var(--heat-0);
    }
    .heat-grid span.l1 { background: var(--heat-1); }
    .heat-grid span.l2 { background: var(--heat-2); }
    .heat-grid span.l3 { background: var(--heat-3); }
    .heat-grid span.l4 { background: var(--heat-4); }
    .heat-foot {
      display: flex;
      justify-content: space-between;
      font: 400 12px/16px var(--font-body);
      color: var(--color-text-secondary);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <ryugi-ios-shell time="09:41" appearance="light">
    <div class="screen" id="root"></div>
  </ryugi-ios-shell>
  <script>
    const expanded = Boolean((window.ryugiProps || {}).statsExpanded);

    // 12 weeks x 5 rows = 60 crisp monochrome ink cells (frameless on warm paper)
    const levels = [
      0,1,0,2,1,0,3,1,2,0,4,3,
      1,0,2,0,1,2,0,3,1,2,1,4,
      0,2,1,0,3,1,0,2,1,3,0,2,
      2,0,3,1,0,2,4,0,2,1,3,4,
      0,1,0,2,1,0,1,2,0,1,2,3
    ];

    const heatHTML = expanded ? `
      <div class="heat-drawer" aria-label="最近 12 周记录热力图">
        <div class="heat-grid">
          ${levels.map(l => `<span${l ? ` class="l${l}"` : ""}></span>`).join("")}
        </div>
        <div class="heat-foot">
          <span>近 12 周</span>
          <span>9月 · 10月 · 11月</span>
        </div>
      </div>
    ` : "";

    document.getElementById("root").innerHTML = `
      <div style="padding:62px 24px 0;opacity:0.35;">
        <div class="day-head">今天</div>
        <p class="note-text">去掉每条笔记外层的白卡片和分隔线后，留白本身就成了结构。</p>
      </div>

      <div class="scrim">
        <aside class="drawer" aria-label="筛选与设置">
          <div class="drawer-close-row">
            <span class="nav-icon-btn" style="margin-right:-10px;" aria-label="关闭抽屉">
              <ryugi-icon symbol="xmark" name="x" size="17"></ryugi-icon>
            </span>
          </div>

          <div class="stats-toggle ${expanded ? "expanded" : ""}" role="button" aria-expanded="${expanded}">
            <span class="stats-summary"><strong>128</strong> 笔记 · <strong>42</strong> 读书 · <strong>68</strong> 天</span>
            <span class="stats-right">
              ${expanded ? "" : `<span class="mini-pulse" aria-hidden="true"><i class="l1"></i><i></i><i class="l2"></i><i class="l1"></i><i class="l3"></i><i class="l2"></i><i class="l4"></i></span>`}
              <ryugi-icon symbol="${expanded ? "chevron.up" : "chevron.down"}" name="${expanded ? "chevron-up" : "chevron-down"}" size="13" style="color:var(--color-text-secondary)"></ryugi-icon>
            </span>
          </div>
          ${heatHTML}

          <div class="seg-text" role="tablist" style="padding-top:16px;">
            <span class="on">全部</span>
            <span>随记</span>
            <span>读书</span>
          </div>

          <div style="padding:8px 0;border-bottom:1px solid var(--color-separator);">
            <div class="plain-row">
              <span>按日期</span>
              <ryugi-icon symbol="chevron.right" name="chevron-right" size="14" style="color:var(--color-text-secondary)"></ryugi-icon>
            </div>
          </div>

          <div style="padding-top:10px;display:flex;flex-direction:column;overflow:hidden;">
            <div class="plain-row">
              <span>#设计</span>
              <span class="meta">24</span>
            </div>
            <div class="plain-row" style="padding-left:18px;color:var(--color-text-secondary);">
              <span>极简</span>
              <span class="meta">11</span>
            </div>
            <div class="plain-row" style="padding-left:18px;color:var(--color-text-secondary);">
              <span>产品</span>
              <span class="meta">13</span>
            </div>
            <div class="plain-row">
              <span>#阅读</span>
              <span class="meta">42</span>
            </div>
            <div class="plain-row">
              <span>#思考</span>
              <span class="meta">19</span>
            </div>
          </div>

          <div class="drawer-foot">
            <div class="plain-row">
              <span>设置</span>
              <ryugi-icon symbol="chevron.right" name="chevron-right" size="14" style="color:var(--color-text-secondary)"></ryugi-icon>
            </div>
          </div>
        </aside>
      </div>
    `;
  </script>
</body>
</html>
