<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../weiji-ios.css" />
  <style>
    .empty-center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      padding: 0 24px 20px;
    }
    .spark-badge {
      width: 48px; height: 48px; border-radius: 24px;
      background: var(--color-accent-soft); color: var(--color-accent-text);
      display: grid; place-items: center;
    }
    .prompt-pill {
      padding: 10px 16px; border-radius: 999px;
      background: var(--color-surface); border: 1px solid var(--color-hairline);
      font: 400 14px/18px var(--font-body); color: var(--color-text-secondary);
      box-shadow: var(--shadow-card);
    }
    .msg-scroll {
      flex: 1; overflow: hidden; padding: 8px 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg-user {
      align-self: flex-end; max-width: 82%;
      background: var(--color-accent); color: #ffffff;
      padding: 10px 14px; border-radius: 18px 18px 4px 18px;
      font: 400 15px/22px var(--font-body);
    }
    .steps-card {
      background: var(--color-surface); border: 1px solid var(--color-hairline);
      border-radius: 14px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 6px;
      font: 400 12px/16px var(--font-body); color: var(--color-text-secondary);
    }
    .msg-ai {
      background: var(--color-surface); border: 1px solid var(--color-hairline);
      border-radius: 18px; padding: 14px 15px;
      font: 400 15px/23px var(--font-body); color: var(--color-text);
      box-shadow: var(--shadow-card);
    }
    .cite {
      display: inline-block; padding: 0 6px; border-radius: 6px;
      background: var(--color-accent-soft); color: var(--color-accent-text);
      font: 600 12px/18px var(--font-body);
    }
    .composer-box {
      margin: 0 14px 92px;
      background: var(--color-surface); border: 1px solid var(--color-hairline);
      border-radius: 22px; padding: 10px 12px 8px;
      box-shadow: var(--shadow-card);
      display: flex; flex-direction: column; gap: 8px;
    }
    .composer-row { display: flex; align-items: center; gap: 6px; }
    .model-pill {
      display: inline-flex; align-items: center; gap: 5px;
      height: 30px; padding: 0 10px; border-radius: 999px;
      background: var(--color-fill); font: 500 12px/16px var(--font-body);
      color: var(--color-text);
    }
    .send-btn {
      margin-left: auto; width: 32px; height: 32px; border-radius: 16px;
      background: var(--color-accent); color: #fff; display: grid; place-items: center;
    }
  </style>
</head>
<body>
  <ryugi-ios-shell time="17:48" appearance="light">
    <div class="screen" id="root"></div>
  </ryugi-ios-shell>
  <script>
    const state = (window.ryugiProps || {}).state || "empty";
    const isThread = state === "thread";
    const isWalk = state === "from-walk";
    const title = isThread ? "HIG 与 M3 对比复盘" : "AI 对话";

    const pinsHTML = (isThread || isWalk) ? `
      <div class="chip-row" style="padding-top:4px;">
        <span class="chip selected"><ryugi-icon symbol="pin.fill" name="pin" size="12"></ryugi-icon>今天按照 Apple HIG 重构了…</span>
        ${isWalk ? `<span class="chip selected"><ryugi-icon symbol="pin.fill" name="pin" size="12"></ryugi-icon>Material Design 3 的 tonal…</span>` : ""}
      </div>
    ` : "";

    const bodyHTML = isThread ? `
      <div class="msg-scroll">
        <div class="msg-user">帮我总结这周关于 HIG 和 M3 的三条核心实践原则。</div>
        <div class="steps-card">
          <div style="display:flex;align-items:center;gap:6px;font-weight:600;color:var(--color-text);">
            <ryugi-icon symbol="sparkles" name="sparkles" size="13" style="color:var(--color-accent-text)"></ryugi-icon>
            <span>已检索 4 条相关笔记 · 耗时 1.2s</span>
          </div>
          <div>• 召回「Apple HIG 导航层重构」与「M3 Tonal Surface」</div>
        </div>
        <div class="msg-ai">
          综合你本周的记录，核心收敛为三条工程原则：<br/><br/>
          <strong>1. 原生容器优先</strong>：iOS 统一走原生 TabView / NavigationStack，大面板保持实底不透色 <span class="cite">[1]</span>。<br/>
          <strong>2. 语义色彩层级</strong>：Web 端用 M3 五级炭灰表面替代纯黑，保证暗色 AA ≥ 4.5:1 <span class="cite">[2]</span>。<br/>
          <strong>3. 真实触控热区</strong>：移动端 44pt/48px 必须落在真实命中控件本身。
        </div>
      </div>
    ` : `
      <div class="empty-center">
        <div class="spark-badge"><ryugi-icon symbol="sparkles" name="sparkles" size="22"></ryugi-icon></div>
        <div style="font:600 18px/24px var(--font-body);">${isWalk ? "围绕这组漫步笔记聊聊" : "和你的笔记聊聊"}</div>
        <div class="prompt-pill">${isWalk ? "这两条设计规范笔记有什么共同点？" : "最近我在关注什么？"}</div>
        <div class="prompt-pill">帮我回顾这周的读书摘录</div>
        <div class="prompt-pill">我的笔记里有哪些反复出现的想法？</div>
      </div>
    `;

    document.getElementById("root").innerHTML = `
      <div class="ios-nav">
        <span class="ios-glass-btn" aria-label="历史会话"><ryugi-icon symbol="clock.arrow.circlepath" name="clock" size="17"></ryugi-icon></span>
        <span class="ios-nav-title">${title}</span>
        <div class="ios-glass-pill">
          <span class="pill-item" aria-label="设置"><ryugi-icon symbol="gearshape" name="settings" size="17"></ryugi-icon></span>
          <span class="pill-item" aria-label="新建会话"><ryugi-icon symbol="square.and.pencil" name="square-pen" size="17"></ryugi-icon></span>
        </div>
      </div>
      ${pinsHTML}
      ${bodyHTML}
      <div class="composer-box">
        <div style="font:400 15px/20px var(--font-body);color:${isWalk ? "var(--color-text)" : "var(--color-text-tertiary)"};padding:2px 2px 4px;">
          ${isWalk ? "对比一下 Apple HIG 与 M3 在暗色模式上的差异" : "问一问你的笔记"}
        </div>
        <div class="composer-row">
          <ryugi-icon symbol="at" name="at-sign" size="17" style="color:var(--color-text-secondary);padding:0 4px;"></ryugi-icon>
          <span class="model-pill"><ryugi-icon symbol="brain" name="brain" size="13" style="color:var(--color-accent-text)"></ryugi-icon>GPT-4.1 Mini ▾</span>
          <span class="model-pill">思考：中</span>
          <span class="send-btn" style="opacity:${isWalk ? "1" : "0.4"}"><ryugi-icon symbol="arrow.up" name="arrow-up" size="16"></ryugi-icon></span>
        </div>
      </div>

      <nav class="ios-tabbar" aria-label="主导航">
        <div class="ios-tab"><ryugi-icon symbol="text.alignleft" name="text-align-start" size="19"></ryugi-icon><span>笔记</span></div>
        <div class="ios-tab"><ryugi-icon symbol="point.topleft.down.to.point.bottomright.curvepath" name="waypoints" size="19"></ryugi-icon><span>漫步</span></div>
        <div class="ios-tab active"><ryugi-icon symbol="bubble.left" name="message-circle" size="19"></ryugi-icon><span>AI</span></div>
        <div class="ios-tab"><ryugi-icon symbol="chart.bar.xaxis" name="chart-no-axes-column-increasing" size="19"></ryugi-icon><span>洞察</span></div>
      </nav>
    `;
  </script>
</body>
</html>
