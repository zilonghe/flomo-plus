<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../weiji-ios.css" />
  <style>
    .pin-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 14px; border-radius: 14px;
      background: var(--color-surface); border: 1px solid var(--color-hairline);
    }
    .pin-row.picked { border-color: var(--color-accent-text); background: var(--color-accent-soft); }
  </style>
</head>
<body>
  <ryugi-ios-shell time="17:48" appearance="light">
    <div class="screen">
      <div class="sheet-backdrop">
        <div class="sheet-card full">
          <div class="sheet-grabber"></div>
          <div class="sheet-bar">
            <span class="action muted">清除 (2)</span>
            <span class="ios-nav-title">引用笔记</span>
            <span class="action bold">完成</span>
          </div>
          <div class="ios-search">
            <ryugi-icon symbol="magnifyingglass" name="search" size="16"></ryugi-icon>
            <span>搜索笔记</span>
          </div>
          <div class="ios-scroll no-tab">
            <div class="pin-row picked">
              <ryugi-icon symbol="checkmark.circle.fill" name="circle-check" size="18" style="color:var(--color-accent-text);margin-top:2px;flex-shrink:0;"></ryugi-icon>
              <div>
                <div style="font:500 12px/16px var(--font-body);color:var(--color-text-tertiary);">2026-11-27</div>
                <div style="font:400 14px/21px var(--font-body);">今天按照 Apple HIG 重构了 iOS 导航层，原生 TabView 和 NavigationStack…</div>
              </div>
            </div>
            <div class="pin-row picked">
              <ryugi-icon symbol="checkmark.circle.fill" name="circle-check" size="18" style="color:var(--color-accent-text);margin-top:2px;flex-shrink:0;"></ryugi-icon>
              <div>
                <div style="font:500 12px/16px var(--font-body);color:var(--color-text-tertiary);">2026-11-24</div>
                <div style="font:400 14px/21px var(--font-body);">Material Design 3 的 tonal surface 层级非常适合阅读类 Web 应用…</div>
              </div>
            </div>
            <div class="pin-row">
              <span style="width:18px;height:18px;border-radius:9px;border:1.5px solid var(--color-separator);margin-top:2px;flex-shrink:0;"></span>
              <div>
                <div style="font:500 12px/16px var(--font-body);color:var(--color-text-tertiary);">2026-11-22</div>
                <div style="font:400 14px/21px var(--font-body);">阅读类应用在深色模式下必须控制文本与占位符对比度，避免纯白刺眼…</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ryugi-ios-shell>
</body>
</html>
