<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../weiji-ios.css" />
  <style>
    .walk-bg {
      background: radial-gradient(circle at 50% 38%, rgba(45, 106, 79, 0.08), transparent 68%);
    }
    .prev-card {
      align-self: center;
      width: 260px;
      padding: 9px 14px;
      border-radius: 13px;
      background: var(--color-surface);
      border: 1px dashed rgba(45, 106, 79, 0.4);
      display: flex; flex-direction: column; gap: 3px;
    }
    .conn-v { width: 1.5px; height: 18px; background: rgba(45, 106, 79, 0.35); margin: 0 auto; }
    .focus-card {
      position: relative;
      background: var(--color-surface);
      border: 1.5px solid rgba(45, 106, 79, 0.32);
      border-radius: 22px;
      padding: 16px 16px 16px 24px;
      box-shadow: 0 5px 14px rgba(45, 106, 79, 0.1);
      display: flex; flex-direction: column; gap: 10px;
    }
    .focus-bar {
      position: absolute; left: 10px; top: 18px; bottom: 18px; width: 3px;
      border-radius: 3px; background: var(--color-accent-tone);
    }
    .focus-body { font: 400 17px/27px var(--font-serif); color: var(--color-text); }
    .rel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rel-card {
      background: var(--color-surface);
      border: 1px solid var(--color-hairline);
      border-radius: 16px;
      padding: 11px 12px;
      box-shadow: var(--shadow-card);
      display: flex; flex-direction: column; gap: 7px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 3px; min-width: 0;
      padding: 3px 8px; border-radius: 999px;
      font: 500 11px/15px var(--font-body);
    }
    .badges { display: flex; gap: 6px; }
    .badge span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .b-pine { background: var(--color-accent-soft); color: var(--color-accent-text); }
    .b-indigo { background: var(--color-indigo-soft); color: var(--color-indigo); }
    .b-graph { background: var(--color-graphite-soft); color: var(--color-graphite); }
    .rel-text {
      font: 400 13px/19px var(--font-body); color: var(--color-text);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .rel-foot { display: flex; justify-content: space-between; font: 500 12px/16px var(--font-body); }
  </style>
</head>
<body>
  <ryugi-ios-shell time="17:48" appearance="light">
    <div class="screen walk-bg" id="root"></div>
  </ryugi-ios-shell>
  <script>
    const pivoted = Boolean((window.ryugiProps || {}).pivoted);
    const prevHTML = pivoted ? `
      <div class="prev-card">
        <div style="font:600 12px/16px var(--font-body);color:var(--color-accent-text)">← 上一步 · 随记</div>
        <div style="font:400 12px/16px var(--font-body);color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">今天按照 Apple HIG 重构了 iOS 导航层…</div>
      </div>
      <div class="conn-v"></div>
    ` : "";

    const focusSource = pivoted ? "设计系统实践" : "随记";
    const focusDate = pivoted ? "2026-11-24" : "2026-11-27";
    const focusBody = pivoted
      ? "Material Design 3 的 tonal surface 层级非常适合阅读类 Web 应用，在浅色暖纸和深色炭灰下都能保持清晰的卡片层次。"
      : "今天按照 Apple HIG 重构了 iOS 导航层，原生 TabView 和 NavigationStack 让 Liquid Glass 效果自然融入系统。#设计/HIG";

    const related = pivoted ? [
      { cls: "b-pine", tag: "#设计/M3", body: "阅读类应用在深色模式下必须控制文本与占位符对比度，避免纯白刺眼…", pct: "24%" },
      { cls: "b-pine", tag: "#设计/HIG", body: "好的设计规范不是限制创造力，而是把触控热区、动态字号变成默认能力…", pct: "19%" },
      { book: "设计系统实践", body: "设计 Token 的价值在于语义层与色板层分离，换主题无需改组件…", pct: "17%" },
      { cls: "b-indigo", tag: "#工作/复盘", body: "用 Ryugi 画板把各步交互串联起来，评审时一眼能看清全貌…", pct: "12%" }
    ] : [
      { cls: "b-pine", tag: "#设计/M3", book: "设计系统实践", body: "Material Design 3 的 tonal surface 层级非常适合阅读类 Web 应用…", pct: "21%" },
      { cls: "b-pine", tag: "#设计/HIG", body: "好的设计规范不是限制创造力，而是把触控热区和动态字号变成默认…", pct: "18%" },
      { cls: "b-indigo", tag: "#工作/复盘", body: "回顾这一周的笔记体系：把热力图保持为安静的视觉概览…", pct: "15%" },
      { book: "设计系统实践", body: "阅读类应用在深色模式下必须控制文本与占位符对比度…", pct: "11%" }
    ];

    document.getElementById("root").innerHTML = `
      <div class="ios-nav">
        <span class="ios-glass-btn" aria-label="快速记"><ryugi-icon symbol="square.and.pencil" name="square-pen" size="17"></ryugi-icon></span>
        <div class="ios-glass-pill">
          <span class="pill-item">随机</span>
          <span class="pill-item accent">问 AI</span>
        </div>
      </div>
      <div class="ios-large-title">漫步</div>
      <div class="ios-scroll" style="gap:0;">
        ${prevHTML}
        <article class="focus-card">
          <div class="focus-bar"></div>
          <div style="display:flex;align-items:center;gap:6px;font:600 13px/18px var(--font-body);color:var(--color-accent-text);">
            <ryugi-icon symbol="scope" name="target" size="14"></ryugi-icon>
            <span>${focusSource}</span>
          </div>
          <div class="focus-body">${focusBody}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;font:500 13px/18px var(--font-body);">
            <span style="color:var(--color-text-tertiary);font-variant-numeric:tabular-nums;">${focusDate}</span>
            <ryugi-icon symbol="arrow.up.right" name="arrow-up-right" size="13" style="color:var(--color-accent-text)"></ryugi-icon>
          </div>
        </article>
        <svg viewBox="0 0 370 28" width="370" height="28" style="flex-shrink:0;display:block;margin:0 auto;">
          <path d="M185 0 C185 14 92 12 92 28" fill="none" stroke="rgba(45,106,79,0.32)" stroke-width="1.5"/>
          <path d="M185 0 C185 14 278 12 278 28" fill="none" stroke="rgba(45,106,79,0.32)" stroke-width="1.5"/>
        </svg>
        <div class="rel-grid">
          ${related.map(r => `
            <article class="rel-card">
              ${r.tag || r.book ? `<div class="badges">
                ${r.tag ? `<span class="badge ${r.cls}"><span>${r.tag}</span></span>` : ""}
                ${r.book ? `<span class="badge b-graph"><ryugi-icon symbol="book.closed" name="book" size="11"></ryugi-icon><span>${r.book}</span></span>` : ""}
              </div>` : ""}
              <div class="rel-text">${r.body}</div>
              <div class="rel-foot">
                <span style="color:var(--color-text-secondary);font-variant-numeric:tabular-nums;">${r.pct}</span>
                <ryugi-icon symbol="arrow.right" name="arrow-right" size="13" style="color:var(--color-accent-text)"></ryugi-icon>
              </div>
            </article>
          `).join("")}
        </div>
      </div>

      <nav class="ios-tabbar" aria-label="主导航">
        <div class="ios-tab"><ryugi-icon symbol="text.alignleft" name="text-align-start" size="19"></ryugi-icon><span>笔记</span></div>
        <div class="ios-tab active"><ryugi-icon symbol="point.topleft.down.to.point.bottomright.curvepath" name="waypoints" size="19"></ryugi-icon><span>漫步</span></div>
        <div class="ios-tab"><ryugi-icon symbol="bubble.left" name="message-circle" size="19"></ryugi-icon><span>AI</span></div>
        <div class="ios-tab"><ryugi-icon symbol="chart.bar.xaxis" name="chart-no-axes-column-increasing" size="19"></ryugi-icon><span>洞察</span></div>
      </nav>
    `;
  </script>
</body>
</html>
