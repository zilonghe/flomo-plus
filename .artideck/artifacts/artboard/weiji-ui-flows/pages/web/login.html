<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../weiji-web.css" />
  <style>
    .auth-shell {
      width: 1280px; height: 800px;
      display: grid; place-items: center;
      background: var(--color-bg);
    }
    .auth-card {
      width: 400px;
      padding: 40px 34px 32px;
      background: var(--color-surface);
      border: 1px solid var(--color-separator);
      border-radius: 24px;
      box-shadow: var(--shadow-sheet);
      display: flex; flex-direction: column; align-items: center; gap: 22px;
    }
    .auth-mark {
      width: 56px; height: 56px; border-radius: 16px;
      background: var(--color-accent-soft); color: var(--color-accent-text);
      display: grid; place-items: center;
    }
    .auth-providers { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .auth-btn {
      width: 100%; height: 46px; border-radius: 12px;
      border: 1px solid var(--color-separator);
      background: var(--color-bg);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font: 500 15px/20px var(--font-body); color: var(--color-text);
    }
    .auth-btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div class="auth-shell">
    <main class="auth-card">
      <div class="auth-mark"><ryugi-icon name="text-align-start" size="26"></ryugi-icon></div>
      <div style="text-align:center;">
        <h1 style="margin:0;font:700 26px/32px var(--font-display)">微记</h1>
        <p style="margin:6px 0 0;font:400 14px/20px var(--font-body);color:var(--color-text-secondary)">自托管个人随记、读书摘录与 AI 思考工作台</p>
      </div>
      <nav class="auth-providers" aria-label="登录方式">
        <div class="auth-btn primary"><ryugi-icon name="check" size="16"></ryugi-icon><span>使用 GitHub 登录</span></div>
        <div class="auth-btn"><span>使用 Google 登录</span></div>
      </nav>
      <div style="display:flex;gap:10px;font:400 12px/16px var(--font-body);color:var(--color-text-tertiary);">
        <span>隐私政策</span><span>·</span><span>服务条款</span>
      </div>
    </main>
  </div>
</body>
</html>
