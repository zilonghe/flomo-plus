<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../weiji-ios.css" />
  <style>
    .field-block { padding: 12px 14px; border-bottom: 1px solid var(--color-hairline); display: flex; flex-direction: column; gap: 4px; }
    .field-block:last-child { border-bottom: none; }
    .field-lbl { font: 500 12px/16px var(--font-body); color: var(--color-text-tertiary); }
    .field-val { font: 400 15px/22px var(--font-body); color: var(--color-text); }
  </style>
</head>
<body>
  <ryugi-ios-shell time="17:48" appearance="light">
    <div class="screen">
      <div class="sheet-backdrop">
        <div class="sheet-card full">
          <div class="sheet-grabber"></div>
          <div class="sheet-bar">
            <span class="action muted">取消</span>
            <span class="ios-nav-title">新视角</span>
            <span class="action bold">保存</span>
          </div>
          <div class="form-group" style="margin-top:10px;">
            <div class="field-block">
              <span class="field-lbl">名称</span>
              <span class="field-val">第一性原理复盘</span>
            </div>
            <div class="field-block">
              <span class="field-lbl">分类</span>
              <span class="field-val">我的</span>
            </div>
            <div class="field-block">
              <span class="field-lbl">描述</span>
              <span class="field-val">剥离表象和经验假设，找出近期笔记里真正的瓶颈与杠杆点。</span>
            </div>
            <div class="field-block">
              <span class="field-lbl">分析提示词</span>
              <span class="field-val" style="line-height:24px;">
                请阅读所选笔记，按以下结构输出：<br/>
                1. 我在哪些问题上陷入了局部最优或经验主义？<br/>
                2. 回到原始目标，最直接的解决方案是什么？<br/>
                3. 列出 2 条可验证的行动项，并附原笔记引用。
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ryugi-ios-shell>
</body>
</html>
