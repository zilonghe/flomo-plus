<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../weiji-ios.css" />
  <style>
    .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 12px 10px; }
    .sw { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 400 12px/16px var(--font-body); color: var(--color-text-secondary); }
    .sw-dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
    .sw.active { color: var(--color-text); font-weight: 600; }
    .sw.active .sw-ring { padding: 3px; border: 2px solid #2d6a4f; border-radius: 50%; }
  </style>
</head>
<body>
  <ryugi-ios-shell time="17:48" appearance="light">
    <div class="screen">
      <div class="sheet-backdrop">
        <div class="sheet-card full">
          <div class="sheet-grabber"></div>
          <div class="sheet-bar">
            <span class="action">关闭</span>
            <span class="ios-nav-title">连接设置</span>
            <span style="width:44px"></span>
          </div>

          <div class="form-section-title">外观</div>
          <div class="form-group">
            <div style="padding:12px 14px 0;font:500 14px/20px var(--font-body);">主题色</div>
            <div class="swatches">
              <div class="sw active"><span class="sw-ring"><span class="sw-dot" style="background:#2d6a4f"><ryugi-icon symbol="checkmark" name="check" size="14"></ryugi-icon></span></span><span>松针</span></div>
              <div class="sw"><span class="sw-dot" style="background:#2553a6"></span><span>靛青</span></div>
              <div class="sw"><span class="sw-dot" style="background:#9e4b28"></span><span>陶土</span></div>
              <div class="sw"><span class="sw-dot" style="background:#6a4a96"></span><span>暮紫</span></div>
              <div class="sw"><span class="sw-dot" style="background:#363430"></span><span>石墨</span></div>
            </div>
          </div>

          <div class="form-section-title">自托管服务</div>
          <div class="form-group">
            <div class="form-row"><span>服务器地址</span><span class="form-val">weiji.18818888.xyz</span></div>
            <div class="form-row"><span>登录账号</span><span class="form-val">GitHub · 已授权</span></div>
            <div class="form-row"><span style="color:var(--color-danger)">退出登录</span></div>
          </div>

          <div class="form-section-title">语义检索索引</div>
          <div class="form-group">
            <div class="form-row"><span>已索引笔记</span><span class="form-val">128 / 128</span></div>
            <div class="form-row"><span style="color:var(--color-accent-text)">重建语义索引</span></div>
          </div>

          <div class="form-section-title">Obsidian 同步</div>
          <div class="form-group">
            <div class="form-row"><span>上次同步</span><span class="form-val">今天 16:40</span></div>
            <div class="form-row"><span style="color:var(--color-accent-text)">立即同步 Obsidian</span></div>
          </div>
        </div>
      </div>
    </div>
  </ryugi-ios-shell>
</body>
</html>
