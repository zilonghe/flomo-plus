<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../weiji-ios.css" />
  <style>
    .bg-dim { padding: 12px 16px; opacity: 0.45; }
    .editor-area {
      flex: 1; padding: 10px 18px;
      font: 400 17px/26px var(--font-body);
      color: var(--color-text);
    }
    .suggest-bar {
      display: flex; gap: 8px; padding: 8px 16px;
      background: var(--color-bg);
      border-top: 1px solid var(--color-hairline);
      overflow: hidden;
    }
    .suggest-pill {
      display: inline-flex; align-items: center; gap: 2px;
      height: 32px; padding: 0 11px; border-radius: 999px;
      background: var(--color-surface); border: 1px solid var(--color-hairline);
      font: 500 13px/18px var(--font-body); white-space: nowrap;
    }
    .accessory-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      background: var(--color-surface);
      border-top: 1px solid var(--color-hairline);
    }
    .hash-pill {
      display: inline-flex; align-items: center; gap: 4px;
      height: 34px; padding: 0 12px; border-radius: 999px;
      background: var(--color-accent-soft); color: var(--color-accent-text);
      font: 500 13px/18px var(--font-body);
    }
    .kb-mock {
      height: 214px; background: var(--color-fill);
      border-top: 1px solid var(--color-hairline);
      padding: 10px 8px;
      display: flex; flex-direction: column; gap: 8px; justify-content: center;
    }
    .kb-row { display: flex; gap: 5px; justify-content: center; }
    .kb-key {
      flex: 1; max-width: 34px; height: 38px; border-radius: 6px;
      background: var(--color-surface);
      display: grid; place-items: center;
      font: 500 15px/20px var(--font-body); color: var(--color-text);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.14);
    }
  </style>
</head>
<body>
  <ryugi-ios-shell time="17:48" appearance="light">
    <div class="screen">
      <div class="bg-dim">
        <div class="ios-large-title" style="padding:0">笔记</div>
      </div>
      <div class="sheet-backdrop">
        <div class="sheet-card full" style="padding-bottom:0">
          <div class="sheet-grabber"></div>
          <div class="sheet-bar">
            <span class="action muted">取消</span>
            <span class="ios-nav-title">记一条</span>
            <span class="action bold">保存</span>
          </div>
          <div class="editor-area">
            把每一跳 UI 流用 Ryugi 画板文件化之后，设计和代码实现就能共享同一套结构和 Token。<span class="tag">#设计/</span>
          </div>
          <div class="suggest-bar">
            <span class="suggest-pill"><span class="tag">#</span>设计/HIG</span>
            <span class="suggest-pill"><span class="tag">#</span>设计/M3</span>
            <span class="suggest-pill"><span class="tag">#</span>工作/复盘</span>
          </div>
          <div class="accessory-bar">
            <span class="hash-pill">
              <ryugi-icon symbol="number" name="hash" size="14"></ryugi-icon>
              <span>标签</span>
            </span>
            <span style="font:var(--type-meta);color:var(--color-text-tertiary);font-variant-numeric:tabular-nums;">46 字</span>
            <div style="margin-left:auto" class="btn-primary sm">
              <ryugi-icon symbol="arrow.up" name="arrow-up" size="14"></ryugi-icon>
              <span>保存</span>
            </div>
          </div>
          <div class="kb-mock" aria-hidden="true">
            <div class="kb-row">
              <span class="kb-key">Q</span><span class="kb-key">W</span><span class="kb-key">E</span><span class="kb-key">R</span><span class="kb-key">T</span><span class="kb-key">Y</span><span class="kb-key">U</span><span class="kb-key">I</span><span class="kb-key">O</span><span class="kb-key">P</span>
            </div>
            <div class="kb-row">
              <span class="kb-key">A</span><span class="kb-key">S</span><span class="kb-key">D</span><span class="kb-key">F</span><span class="kb-key">G</span><span class="kb-key">H</span><span class="kb-key">J</span><span class="kb-key">K</span><span class="kb-key">L</span>
            </div>
            <div class="kb-row">
              <span class="kb-key">Z</span><span class="kb-key">X</span><span class="kb-key">C</span><span class="kb-key">V</span><span class="kb-key">B</span><span class="kb-key">N</span><span class="kb-key">M</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ryugi-ios-shell>
</body>
</html>
