<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../weiji-ios.css" />
  <style>
    .drawer-head { display:flex; align-items:center; justify-content:space-between; padding:6px 14px 8px 16px; min-height:48px; }
    .new-btn {
      margin: 0 16px 12px; height: 44px; padding: 0 14px; border-radius: 12px;
      background: var(--color-accent-soft); color: var(--color-accent-text);
      display: flex; align-items: center; gap: 8px; font: 600 15px/20px var(--font-body);
    }
    .sess-list { flex:1; padding: 0 16px; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
    .sess-row {
      padding: 11px 12px; border-radius: 12px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .sess-row.active { background: var(--color-surface); border: 1px solid var(--color-hairline); }
  </style>
</head>
<body>
  <ryugi-ios-shell time="17:48" appearance="light">
    <div class="screen">
      <div class="drawer-scrim">
        <aside class="drawer-panel">
          <div class="drawer-head">
            <span style="font:700 20px/24px var(--font-display)">历史会话</span>
            <ryugi-icon symbol="xmark" name="x" size="18" style="color:var(--color-text-secondary)"></ryugi-icon>
          </div>
          <div class="new-btn">
            <ryugi-icon symbol="plus" name="plus" size="16"></ryugi-icon>
            <span>新建对话</span>
          </div>
          <div class="sess-list">
            <div class="sess-row active">
              <span style="font:600 15px/20px var(--font-body);">HIG 与 M3 对比复盘</span>
              <span style="font:400 12px/16px var(--font-body);color:var(--color-text-tertiary);">今天 17:42 · 4 条消息</span>
            </div>
            <div class="sess-row">
              <span style="font:500 15px/20px var(--font-body);">这周的读书摘录梳理</span>
              <span style="font:400 12px/16px var(--font-body);color:var(--color-text-tertiary);">11月25日 · 6 条消息</span>
            </div>
            <div class="sess-row">
              <span style="font:500 15px/20px var(--font-body);">设计系统 Token 分层讨论</span>
              <span style="font:400 12px/16px var(--font-body);color:var(--color-text-tertiary);">11月23日 · 8 条消息</span>
            </div>
            <div class="sess-row">
              <span style="font:500 15px/20px var(--font-body);">关于长期主义与工程取舍</span>
              <span style="font:400 12px/16px var(--font-body);color:var(--color-text-tertiary);">11月20日 · 3 条消息</span>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </ryugi-ios-shell>
</body>
</html>
