<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../weiji-ios.css" />
</head>
<body>
  <ryugi-ios-shell time="17:48" appearance="light">
    <div class="screen">
      <div class="sheet-backdrop">
        <div class="sheet-card medium">
          <div class="sheet-grabber"></div>
          <div class="sheet-bar">
            <span style="width:44px"></span>
            <span class="ios-nav-title">历史报告</span>
            <span class="action bold">完成</span>
          </div>
          <div class="ios-scroll no-tab">
            <article class="note-card">
              <div style="display:flex;justify-content:space-between;font:500 12px/16px var(--font-body);">
                <span style="color:var(--color-accent-text)">默认洞察</span>
                <span style="color:var(--color-text-tertiary);font-variant-numeric:tabular-nums;">2026-11-27</span>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font:600 16px/22px var(--font-body);">近 7 天设计重构洞察</span>
                <ryugi-icon symbol="chevron.right" name="chevron-right" size="14" style="color:var(--color-text-tertiary)"></ryugi-icon>
              </div>
              <div style="font:400 13px/19px var(--font-body);color:var(--color-text-secondary);">本周记录高度聚焦于原生规范落地、高对比度与真实触控热区…</div>
            </article>
            <article class="note-card">
              <div style="display:flex;justify-content:space-between;font:500 12px/16px var(--font-body);">
                <span style="color:var(--color-plum)">价值澄清</span>
                <span style="color:var(--color-text-tertiary);font-variant-numeric:tabular-nums;">2026-11-23</span>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font:600 16px/22px var(--font-body);">11 月产品取舍与长期主义</span>
                <ryugi-icon symbol="chevron.right" name="chevron-right" size="14" style="color:var(--color-text-tertiary)"></ryugi-icon>
              </div>
              <div style="font:400 13px/19px var(--font-body);color:var(--color-text-secondary);">在个人工具构建中，宁愿前期投入结构设计，也不留返工债务…</div>
            </article>
            <article class="note-card">
              <div style="display:flex;justify-content:space-between;font:500 12px/16px var(--font-body);">
                <span style="color:var(--color-indigo)">逆向思考</span>
                <span style="color:var(--color-text-tertiary);font-variant-numeric:tabular-nums;">2026-11-18</span>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font:600 16px/22px var(--font-body);">知识库为什么会变成收集癖？</span>
                <ryugi-icon symbol="chevron.right" name="chevron-right" size="14" style="color:var(--color-text-tertiary)"></ryugi-icon>
              </div>
              <div style="font:400 13px/19px var(--font-body);color:var(--color-text-secondary);">如果只做单向录入而不通过漫步与洞察反刍，记录很快失效…</div>
            </article>
          </div>
        </div>
      </div>
    </div>
  </ryugi-ios-shell>
</body>
</html>
